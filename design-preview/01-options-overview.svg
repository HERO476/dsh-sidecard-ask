<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1480" height="640" fill="#f7f8fa"/>

  <!-- color note -->
  <text x="32" y="40" font-size="18" font-weight="600" fill="#111827">同一张卡片的 4 种改进方向（示意图 1/2）</text>
  <text x="32" y="64" font-size="12.5" fill="#6b7280">颜色仅为示意：真实实现全部走 DSH 主题令牌 --dsw-alias-*，亮色/暗色主题都会自动跟随。</text>

  <g font-size="12.5" fill="#374151">
    <circle cx="44" cy="90" r="5" fill="#4c8dff"/><text x="58" y="95">A 悬浮胶囊 → 展开</text>
    <circle cx="248" cy="90" r="5" fill="#10b981"/><text x="262" y="95">B 轻量卡片（保留右下角定位）</text>
    <circle cx="540" cy="90" r="5" fill="#8b5cf6"/><text x="554" y="95">C 卡片停靠右侧栏</text>
    <circle cx="800" cy="90" r="5" fill="#f59e0b"/><text x="814" y="95">D 就地插入对话（不再浮层）</text>
  </g>

  <!-- ================= A ================= -->
  <g transform="translate(32,120)">
    <rect x="0" y="0" width="320" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="0" y="0" width="320" height="34" rx="12" fill="#f1f3f5"/>
    <rect x="0" y="22" width="320" height="12" fill="#f1f3f5"/>
    <text x="14" y="23" font-size="13" font-weight="600" fill="#111827">A · 悬浮胶囊 → 展开</text>

    <!-- conversation lines behind -->
    <g fill="#d1d5db">
      <rect x="16" y="60" width="270" height="8" rx="4"/>
      <rect x="16" y="78" width="220" height="8" rx="4"/>
      <rect x="16" y="96" width="250" height="8" rx="4"/>
      <rect x="16" y="114" width="150" height="8" rx="4"/>
    </g>

    <!-- pill, anchored bottom-right but collapsed to one line -->
    <g transform="translate(60,150)">
      <rect x="0" y="0" width="244" height="44" rx="22" fill="#ffffff" stroke="#e5e7eb"/>
      <circle cx="22" cy="22" r="4.5" fill="#4c8dff">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="20" font-size="12" fill="#111827">正在作答…</text>
      <text x="36" y="35" font-size="11" fill="#9ca3af">“现在可以直接打印，更具排版…”</text>
      <text x="212" y="27" font-size="15" fill="#9ca3af">›</text>
      <rect x="10" y="40" width="180" height="2.5" rx="1.25" fill="#4c8dff" opacity="0.85">
        <animate attributeName="width" values="30;180;60;180;30" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g fill="#d1d5db">
      <rect x="16" y="230" width="240" height="8" rx="4"/>
      <rect x="16" y="248" width="270" height="8" rx="4"/>
      <rect x="16" y="266" width="190" height="8" rx="4"/>
    </g>

    <!-- expanded state -->
    <g transform="translate(28,300)">
      <rect x="0" y="0" width="264" height="150" rx="14" fill="#ffffff" stroke="#dbe1e8"/>
      <rect x="0" y="0" width="264" height="30" rx="14" fill="#fafbfc"/>
      <rect x="0" y="20" width="264" height="10" fill="#fafbfc"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <text x="28" y="19" font-size="11.5" fill="#374151">已完成 · 聊天区</text>
      <text x="244" y="19" font-size="14" fill="#9ca3af" text-anchor="end">⌄</text>
      <text x="14" y="52" font-size="12" fill="#4b5563">答案会出现在主对话里，随对话正常</text>
      <text x="14" y="70" font-size="12" fill="#4b5563">流式输出。也可以留在侧边卡片里…</text>
      <rect x="14" y="86" width="1" height="16" fill="#e5e7eb"/>
      <text x="22" y="99" font-size="11" fill="#6b7280">现在可以直接打印，更具排版…</text>
      <text x="14" y="132" font-size="11.5" fill="#4c8dff">复制</text>
      <text x="60" y="132" font-size="11.5" fill="#6b7280">继续追问</text>
      <text x="240" y="132" font-size="11.5" fill="#6b7280" text-anchor="end">关闭</text>
    </g>
  </g>

  <!-- ================= B ================= -->
  <g transform="translate(376,120)">
    <rect x="0" y="0" width="320" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="0" y="0" width="320" height="34" rx="12" fill="#f1f3f5"/>
    <rect x="0" y="22" width="320" height="12" fill="#f1f3f5"/>
    <text x="14" y="23" font-size="13" font-weight="600" fill="#111827">B · 轻量卡片（同位置）</text>

    <g fill="#d1d5db">
      <rect x="16" y="60" width="270" height="8" rx="4"/>
      <rect x="16" y="78" width="220" height="8" rx="4"/>
      <rect x="16" y="96" width="250" height="8" rx="4"/>
    </g>

    <g transform="translate(28,120)">
      <rect x="0" y="0" width="264" height="330" rx="12" fill="#fcfdfe" stroke="#e5e7eb"/>
      <line x1="0" y1="34" x2="264" y2="34" stroke="#eef1f4"/>
      <circle cx="16" cy="17" r="4" fill="#10b981"/>
      <text x="28" y="21" font-size="12" font-weight="600" fill="#374151">追问 · 聊天区</text>
      <text x="190" y="21" font-size="11.5" fill="#9ca3af">复制</text>
      <text x="230" y="21" font-size="11.5" fill="#9ca3af">✕</text>

      <rect x="14" y="46" width="236" height="34" rx="6" fill="#f6f8fa"/>
      <rect x="14" y="46" width="2.5" height="34" fill="#cbd5e1"/>
      <text x="24" y="61" font-size="11" fill="#6b7280">现在可以直接打印，更具排版和表现</text>
      <text x="24" y="74" font-size="11" fill="#9ca3af">力来决定自我评价的字数</text>

      <text x="14" y="106" font-size="12" fill="#374151">答案会出现在主对话里，随对话正常流式</text>
      <text x="14" y="124" font-size="12" fill="#374151">输出。</text>

      <line x1="14" y1="284" x2="250" y2="284" stroke="#eef1f4"/>
      <text x="14" y="313" font-size="11.5" fill="#4c8dff">复制</text>
      <text x="54" y="313" font-size="11.5" fill="#6b7280">继续追问</text>
      <text x="120" y="313" font-size="11.5" fill="#9ca3af">重试</text>
      <text x="250" y="313" font-size="11.5" fill="#9ca3af" text-anchor="end">关闭</text>
    </g>
  </g>

  <!-- ================= C ================= -->
  <g transform="translate(720,120)">
    <rect x="0" y="0" width="320" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="0" y="0" width="320" height="34" rx="12" fill="#f1f3f5"/>
    <rect x="0" y="22" width="320" height="12" fill="#f1f3f5"/>
    <text x="14" y="23" font-size="13" font-weight="600" fill="#111827">C · 卡片停靠右侧栏</text>

    <g fill="#d1d5db">
      <rect x="16" y="60" width="170" height="8" rx="4"/>
      <rect x="16" y="78" width="150" height="8" rx="4"/>
      <rect x="16" y="96" width="160" height="8" rx="4"/>
      <rect x="16" y="114" width="110" height="8" rx="4"/>
      <rect x="16" y="132" width="150" height="8" rx="4"/>
    </g>

    <!-- right rail -->
    <rect x="196" y="48" width="110" height="400" rx="10" fill="#fbfcfd" stroke="#e5e7eb"/>
    <rect x="204" y="56" width="52" height="14" rx="4" fill="#eef2f7"/>
    <rect x="262" y="56" width="36" height="14" rx="4" fill="#eef2f7"/>
    <line x1="196" y1="80" x2="306" y2="80" stroke="#eef1f4"/>
    <text x="204" y="100" font-size="10.5" font-weight="600" fill="#374151">追问 · 聊天区</text>
    <rect x="204" y="110" width="94" height="26" rx="5" fill="#f4f6f8"/>
    <text x="210" y="121" font-size="9.5" fill="#9ca3af">现在可以直接打印，更具</text>
    <text x="210" y="132" font-size="9.5" fill="#9ca3af">排版和表现力…</text>
    <text x="204" y="156" font-size="10" fill="#4b5563">答案会出现在主对话里，</text>
    <text x="204" y="168" font-size="10" fill="#4b5563">随对话正常流式输出。</text>
    <line x1="204" y1="416" x2="298" y2="416" stroke="#eef1f4"/>
    <text x="204" y="434" font-size="10" fill="#4c8dff">复制</text>
    <text x="238" y="434" font-size="10" fill="#9ca3af">追问</text>
    <text x="298" y="434" font-size="10" fill="#9ca3af" text-anchor="end">✕</text>

    <!-- toast -->
    <g transform="translate(60,404)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#111827" opacity="0.88"/>
      <circle cx="20" cy="17" r="3.5" fill="#4c8dff"/>
      <text x="34" y="21" font-size="11" fill="#f9fafb">作答中…已停靠右侧栏</text>
    </g>
  </g>

  <!-- ================= D ================= -->
  <g transform="translate(1064,120)">
    <rect x="0" y="0" width="352" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="0" y="0" width="352" height="34" rx="12" fill="#f1f3f5"/>
    <rect x="0" y="22" width="352" height="12" fill="#f1f3f5"/>
    <text x="14" y="23" font-size="13" font-weight="600" fill="#111827">D · 就地插入对话</text>

    <g fill="#d1d5db">
      <rect x="16" y="56" width="300" height="8" rx="4"/>
      <rect x="16" y="74" width="260" height="8" rx="4"/>
    </g>

    <g transform="translate(16,96)">
      <rect x="0" y="0" width="320" height="150" rx="10" fill="#fbfcfd" stroke="#e5e7eb"/>
      <rect x="0" y="0" width="3" height="150" rx="1.5" fill="#4c8dff"/>
      <circle cx="18" cy="22" r="4" fill="#4c8dff"/>
      <text x="30" y="26" font-size="11.5" font-weight="600" fill="#374151">追问回答</text>
      <text x="308" y="26" font-size="12" fill="#9ca3af" text-anchor="end">⌃</text>
      <text x="16" y="48" font-size="11" fill="#9ca3af">“现在可以直接打印，更具排版和表现力…”</text>
      <text x="16" y="72" font-size="12" fill="#374151">答案会出现在主对话里，随对话正常流式</text>
      <text x="16" y="90" font-size="12" fill="#374151">输出。</text>
      <line x1="16" y1="118" x2="304" y2="118" stroke="#eef1f4"/>
      <text x="16" y="136" font-size="11" fill="#4c8dff">复制</text>
      <text x="56" y="136" font-size="11" fill="#6b7280">继续追问</text>
      <text x="304" y="136" font-size="11" fill="#9ca3af" text-anchor="end">收起</text>
    </g>

    <g fill="#d1d5db">
      <rect x="16" y="266" width="250" height="8" rx="4"/>
      <rect x="16" y="284" width="290" height="8" rx="4"/>
      <rect x="16" y="302" width="180" height="8" rx="4"/>
    </g>

    <!-- composer status -->
    <g transform="translate(16,340)">
      <rect x="0" y="0" width="320" height="110" rx="10" fill="#fafbfc" stroke="#e5e7eb"/>
      <text x="14" y="26" font-size="11" fill="#9ca3af">输入消息…</text>
      <line x1="0" y1="44" x2="320" y2="44" stroke="#eef1f4"/>
      <circle cx="20" cy="66" r="4" fill="#10b981"/>
      <text x="32" y="70" font-size="11" fill="#6b7280">侧边作答已完成 · 1 条回答已插入上方对话</text>
      <text x="308" y="70" font-size="11" fill="#4c8dff" text-anchor="end">查看</text>
      <text x="14" y="94" font-size="10.5" fill="#c3c9d2">浮层一个都不留；答案跟着对话一起滚动、一起复制、一起获得焦点</text>
    </g>
  </g>

  <!-- tradeoff strip -->
  <g transform="translate(32,606)">
    <text x="0" y="0" font-size="12.5" fill="#374151"><tspan font-weight="600" fill="#111827">代价：</tspan>A 多一次点击，但默认不挡内容　·　B 改动最小，观感提升有限　·　C 需要右侧栏承载面（本机桌面版可用，未安装时回退浮层）　·　D 改动最大（要往对话流里插节点），但“追问”最像对话的一部分</text>
  </g>
</svg>
